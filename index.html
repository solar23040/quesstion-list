<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Member Questions — Live</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --paper: #faf9f4;
  --paper-raised: #ffffff;
  --ink: #1c211f;
  --ink-soft: #55605c;
  --ink-faint: #8a938e;
  --line: #d9d3c2;
  --line-strong: #b7ae95;
  --blueprint: #2c4a5e;
  --blueprint-tint: #e7edf0;
  --error: #9c4a3c;

  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "IBM Plex Sans", Arial, Helvetica, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  font-family: var(--font-body);
  margin: 0;
  padding: 40px clamp(16px, 4vw, 48px) 60px;
  max-width: 760px;
  margin-inline: auto;
  color: var(--ink);
  background: var(--paper);
  font-size: 14px;
  line-height: 1.5;
}

.page-header h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 3.4vw, 30px);
  font-weight: 700;
  margin: 0 0 6px;
  border-bottom: 3px solid var(--blueprint);
  padding-bottom: 12px;
}

.subtitle {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 12px 0 16px;
}

.raise-question-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--blueprint);
  text-decoration: none;
  border: 1px solid var(--blueprint);
  border-radius: 999px;
  padding: 7px 16px;
  margin-bottom: 24px;
}

.raise-question-link:hover {
  background: var(--blueprint-tint);
}

.raise-question-link:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

.search-row {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--paper);
  padding: 10px 0 16px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

#search-input {
  flex: 1;
  padding: 9px 12px;
  font-family: var(--font-body);
  font-size: 13.5px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--paper-raised);
  color: var(--ink);
}

#search-input:focus-visible {
  outline: 2px solid var(--blueprint);
  outline-offset: 1px;
}

.search-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  white-space: nowrap;
}

.questions-list mark {
  background: #f4d35e;
  color: var(--ink);
  border-radius: 2px;
  padding: 0 1px;
}

.questions-list li.no-match {
  opacity: 0.35;
}

.questions-list {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: q;
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  border-radius: 3px;
  overflow: hidden;
}

.questions-list li {
  counter-increment: q;
  padding: 14px 18px 14px 48px;
  position: relative;
  font-size: 13.5px;
  line-height: 1.55;
  border-bottom: 1px solid var(--line);
}

.questions-list li:last-child {
  border-bottom: none;
}

.questions-list li::before {
  content: counter(q);
  position: absolute;
  left: 16px;
  top: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--blueprint);
  background: var(--blueprint-tint);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.questions-list li.loading-note,
.questions-list li.fetch-error {
  padding-left: 18px;
  color: var(--ink-faint);
  font-style: italic;
}

.questions-list li.loading-note::before,
.questions-list li.fetch-error::before {
  content: none;
}

.questions-list li.fetch-error {
  color: var(--error);
}

.page-footer {
  margin-top: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  text-align: right;
}

.download-btn {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: var(--blueprint);
  border: none;
  border-radius: 4px;
  padding: 9px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 0;
}

.download-btn:hover {
  filter: brightness(1.12);
}

.download-btn:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

.back-to-top-row {
  text-align: center;
  margin-top: 32px;
}

.back-to-top-btn {
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--paper-raised);
  color: var(--blueprint);
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.back-to-top-btn:hover {
  background: var(--blueprint-tint);
}

.back-to-top-btn:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

@media print {
  .download-btn, .back-to-top-row, .search-row, .raise-question-link { display: none; }
  body { background: #fff; padding: 0; }
  .questions-list { border-color: #999; }
  .questions-list li.no-match { opacity: 1; }
}

@media (max-width: 480px) {
  .questions-list li { padding-left: 42px; font-size: 13px; }
}
</style>
</head>
<body>
<header class="page-header">
  <h1>Member-Submitted Questions</h1>
  <p class="subtitle">Pulled automatically from the society's question-submission form each time this page loads.</p>
  <a class="raise-question-link" href="https://tally.so/r/b5QlqZ" rel="noopener" target="_blank">＋ Have another question? Raise it here</a>
</header>

<div class="search-row">
  <input aria-label="Search questions" id="search-input" placeholder="Search questions…" type="text"/>
  <span class="search-count" id="search-count"></span>
</div>

<main>
  <ol class="questions-list" id="questions-list">
    <li class="loading-note">Loading latest questions…</li>
  </ol>
  <button class="download-btn" id="download-pdf-btn" type="button">⬇ Download as PDF</button>
</main>

<div class="back-to-top-row">
  <button aria-label="Back to top" class="back-to-top-btn" id="back-to-top" type="button">↑ Back to top</button>
</div>

<footer class="page-footer">
  <span id="last-updated"></span>
</footer>

<script>
/* ============================================================
   Fetches column F from the "Questions on Redevelopment" Google
   Sheet and renders each non-empty entry as a list item.

   Uses JSONP (a <script> tag), not fetch() — Google's gviz
   endpoint doesn't send CORS headers that fetch() requires, so
   fetch() fails from a local file with a CORS/network error.
   A <script src="..."> tag isn't subject to CORS, so this works
   whether you double-click this file or host it on a server.

   Requires the sheet's sharing setting to be "Anyone with the
   link can view" — no API key or login involved either way.
   ============================================================ */
(function () {
  const SHEET_ID = '1aKtgdgNgE0CxZ2eMA7V6lZhJl2Kdy0TiROfc6vjpVZ8';
  const SHEET_GID = '0';
  const QUESTION_COLUMN_INDEX = 5; // column F (A=0, B=1, C=2, D=3, E=4, F=5)
  const CALLBACK_NAME = '__redevQuestionsCallback';
  const TIMEOUT_MS = 10000;

  document.addEventListener('DOMContentLoaded', () => {
    const listEl = document.getElementById('questions-list');
    const updatedEl = document.getElementById('last-updated');

    const showError = (message) => {
      listEl.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'fetch-error';
      li.textContent = message;
      listEl.appendChild(li);
    };

    let settled = false;

    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      showError('Timed out waiting for the sheet. Check your internet connection and reload.');
    }, TIMEOUT_MS);

    window[CALLBACK_NAME] = function (data) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);

      try {
        const questions = (data.table.rows || [])
          .map((row) => row.c && row.c[QUESTION_COLUMN_INDEX] && row.c[QUESTION_COLUMN_INDEX].v)
          .filter((value) => typeof value === 'string' && value.trim().length > 0);

        listEl.innerHTML = '';

        if (questions.length === 0) {
          showError('No questions found in the sheet yet.');
          return;
        }

        questions.forEach((question) => {
          const li = document.createElement('li');
          li.textContent = question.trim();
          li.dataset.original = question.trim();
          listEl.appendChild(li);
        });

        if (updatedEl) {
          updatedEl.textContent = `Last fetched ${new Date().toLocaleString()}`;
        }

        setupSearch();
      } catch (err) {
        showError('Received a response from the sheet but could not read it. The sheet structure may have changed.');
        console.error('Live questions parse failed:', err);
      }
    };

    const script = document.createElement('script');
    script.src =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
      `?gid=${SHEET_GID}&tqx=out:json;responseHandler:${CALLBACK_NAME}`;

    script.onerror = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      showError('Could not reach the sheet. Make sure it\'s still shared as "Anyone with the link can view."');
    };

    document.body.appendChild(script);

    const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    function setupSearch() {
      const searchInput = document.getElementById('search-input');
      const searchCount = document.getElementById('search-count');
      if (!searchInput) return;

      const items = Array.from(listEl.querySelectorAll('li[data-original]'));

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        let matchCount = 0;
        let firstMatchEl = null;

        items.forEach((li) => {
          const original = li.dataset.original;

          if (!query) {
            li.innerHTML = original;
            li.classList.remove('no-match');
            return;
          }

          const regex = new RegExp(escapeRegExp(query), 'gi');
          if (regex.test(original)) {
            li.innerHTML = original.replace(regex, (m) => `<mark>${m}</mark>`);
            li.classList.remove('no-match');
            matchCount += 1;
            if (!firstMatchEl) firstMatchEl = li;
          } else {
            li.innerHTML = original;
            li.classList.add('no-match');
          }
        });

        if (searchCount) {
          searchCount.textContent = query ? `${matchCount} match${matchCount === 1 ? '' : 'es'}` : '';
        }

        if (firstMatchEl) {
          firstMatchEl.scrollIntoView({
            behavior: reduceMotion ? 'auto' : 'smooth',
            block: 'center',
          });
        }
      });
    }

    const downloadBtn = document.getElementById('download-pdf-btn');
    if (downloadBtn) {
      downloadBtn.addEventListener('click', () => {
        window.print();
      });
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const backToTop = document.getElementById('back-to-top');
    if (backToTop) {
      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      });
    }
  });
})();
</script>
</body>
</html>
